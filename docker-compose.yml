# 定义多容器 Docker 应用：api（摄入）+ rag-api（检索问答）+ qdrant + mysql + redis + syncer + embedder + model
# 可选：crawler（真实公开文档站爬虫，profile=crawler，默认不构建也不运行）
# 起法：docker compose up -d --build  →  docker compose ps（详见 README「快速开始」）
#      看完整流水线：docker compose up -d --scale syncer=2 --scale embedder=3
#      跑爬虫一轮：docker compose --profile crawler run --rm crawler
#
# profiles 说明：不带 profile 的服务是默认启动的；test / crawler 只有显式 --profile 才会被构建或运行。
#
# 端口：容器内 mysql/redis 是 3306/6379。宿主机映射到 3307/6380 —— 只给宿主机上的 GUI 工具用
#      （应用自己永远走服务名，见下面 api 的 environment）；避开本机可能已在跑的实例。
#
# 角色划分（同一个镜像 + APP_ROLE 环境变量）：
#   api     = ingest：写入 + 回收 / enrich，暴露 8000；
#   rag-api = rag   ：检索 / 问答（Qdrant + LLM），暴露 8001，不迁移、不起后台循环。
services:
  # ---------- FastAPI 应用（摄入侧） ----------
  api:
    # 【必须钉 target】：多阶段 Dockerfile 默认只建【最后一个】stage。
    # 不钉的话 api 会去建 test stage（把 pytest 带进生产镜像）。
    build:
      context: .
      target: runtime
    # 不和 rag-api 抢名字 —— 两者的容器名必须不同
    container_name: rag-ingest-api
    ports:
      - "8000:8000"
    # env_file 只提供账号 / 口令 / 业务参数（.env 里没有 host/port）
    env_file:
      - .env
    # host/port 的唯一口径在这里：项目只在 compose 里跑，所以应用连的一律是服务名。
    # （一份环境只描述一处 —— 以前 .env 里那套本地 localhost:3307 已删掉）
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # 摄入进程只挂 documents/chunks/stats 路由，并跑迁移 + 回收 / enrich 循环
      APP_ROLE: ingest
      ENRICH_MODEL_URL: "http://model:8000/enrich"   # enrich 走模型服务时去哪儿调
    depends_on:
      # service_healthy：等对方健康检查通过再启动，防止应用崩溃
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # slim 镜像里没有 curl/wget，但有 python，用它探 /health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  # ---------- 检索 / 问答 API（只读） ----------
  # 用 rag stage（多装 fastembed）；不迁移、不起后台循环、也不强依赖 Redis 可用。
  rag-api:
    build:
      context: .
      target: rag
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      APP_ROLE: rag
      QDRANT_URL: http://qdrant:6333
      # ${VAR:-default} 是 compose 的插值：.env 里写了就用 .env 的，没写用默认值
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      # 宿主机模型目录（scripts\fetch_embedding_model.cmd 下载）只读挂进容器；
      # 容器内路径固定为 /models/bge-small-zh-v1.5，provider 用 specific_model_path 直接加载。
      EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      HF_HUB_OFFLINE: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
      # 问答进程不需要那么多 worker：并发远低于摄入
      API_WORKERS: 2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # qdrant 镜像里没有 curl/wget 做健康检查，只能等进程启动
      qdrant:
        condition: service_started
      # 等摄入侧把库迁完，rag 的只读查询才有表可查
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # 本地 ONNX 模型只读挂载；路径可用 .env 的 EMBEDDING_MODEL_HOST_PATH 覆盖
      - "${EMBEDDING_MODEL_HOST_PATH:-./models/bge-small-zh-v1.5}:/models/bge-small-zh-v1.5:ro"
    restart: unless-stopped
    networks: [backend]

  # ---------- Qdrant 向量库 ----------
  # 不加 healthcheck：镜像里没有 curl/wget；依赖方用 service_started。
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    ports:
      - "6333:6333"                     # 只给宿主机 GUI / curl 排查；应用走 qdrant:6333
    volumes:
      - qdrant_data:/qdrant/storage     # 命名卷：容器删了索引还在（也可随时从 MySQL 重建）
    restart: unless-stopped
    networks: [backend]

  # ---------- 假模型服务（enrich 的"上游"；ENRICH_PROVIDER=model 时才真的会被调到）----------
  # 【故意不写 depends_on】api 不依赖它启动 —— 它挂了正好用来验证降级链：
  # enrich 会回落到规则、入库照样成功。这就是"外部依赖不能拦住主流程"的现场。
  model:
    build: ./model
    restart: unless-stopped
    networks: [backend]

  # ---------- 同步器：周期性批量推文档（可 --scale 起多实例）----------
  syncer:
    build: ./syncer
    # 【不设 container_name / ports】—— 设了就没法 --scale（名字/端口会撞车）
    environment:
      API_BASE: "http://api:8000"     # 容器内用服务名连 api
      SYNC_INTERVAL: "5"              # 每 5 秒推一批
    depends_on:
      api:
        condition: service_healthy   # 等 api 健康再开始推
    restart: unless-stopped
    networks: [backend]

  # ---------- 真实上游爬虫（可选 profile：显式 --profile crawler 才构建 / 运行）----------
  # 按 sitemap 抓公开文档站，条件请求 + 正文哈希做增量，推给 api 的 bulk / delete 接口。
  # 默认 CRAWL_ONCE=true：`compose run --rm` 跑完一轮即退出；要常驻轮询就设 CRAWL_ONCE=false。
  crawler:
    build: ./crawler
    profiles: ["crawler"]
    environment:
      API_BASE: http://api:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CRAWL_SITEMAP_URL: ${CRAWL_SITEMAP_URL:-https://fastapi.tiangolo.com/zh/sitemap.xml}
      CRAWL_URL_PREFIX: ${CRAWL_URL_PREFIX:-https://fastapi.tiangolo.com/zh/}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-150}
      CRAWL_ONCE: ${CRAWL_ONCE:-true}
      CRAWL_INTERVAL_SECONDS: ${CRAWL_INTERVAL_SECONDS:-21600}
      CRAWL_REPLAY: ${CRAWL_REPLAY:-false}
      CRAWL_USER_AGENT: "${CRAWL_USER_AGENT:-rag-ingest-demo/0.1 (+https://github.com/BamdowCoco/rag-ingest-pipeline)}"
      BULK_SIZE: ${BULK_SIZE:-30}
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"          # 默认一轮即退出；常驻请设 CRAWL_ONCE=false
    networks: [backend]

  # ---------- 真实向量化 worker：认领 → embedding → Qdrant upsert/delete → 回报（可 --scale）----------
  embedder:
    # 用 rag stage：多装 fastembed；embedder/ 代码也由该 stage COPY 进镜像
    build:
      context: .
      target: rag
    # 【不设 container_name】—— 设了就没法 --scale
    command: ["python", "-m", "embedder.main"]
    environment:
      API_BASE: "http://api:8000"
      CLAIM_LIMIT: "20"               # 每次认领多少块
      EMBED_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}   # 一批做多少次模型推理
      IDLE_SLEEP: "2"                 # 没活干时的轮询间隔（秒）
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks_v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-512}
      # 与 rag-api 共用同一个只读模型目录；specific_model_path 直接加载，不联网
      EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      HF_HUB_OFFLINE: "1"
      # ONNX 模型缓存目录：挂命名卷，重建镜像 / 容器不必重新下载
      EMBEDDING_CACHE_DIR: /models/fastembed
    volumes:
      - fastembed_models:/models/fastembed
      - "${EMBEDDING_MODEL_HOST_PATH:-./models/bge-small-zh-v1.5}:/models/bge-small-zh-v1.5:ro"
    depends_on:
      api:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks: [backend]

  # ---------- 测试（profile 隔离：只有显式 --profile test 才会跑）----------
  # 用法：docker compose --profile test run --rm test
  #    或限定范围：docker compose --profile test run --rm test pytest -q tests/test_bulk_ingest.py
  # 一次性任务：不设 container_name / restart / ports。
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: rag_ingest_test     # 覆盖 .env 的 rag_ingest：测试绝不碰生产库
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: "15"               # 独享 redis db 号（生产是 0）；清库只用 flushdb 不用 flushall
      DB_ROOT_PASSWORD: root123456 # 建 rag_ingest_test 要 root 权限（app 用户没这个库的权限）
      # 【测试绝不打真上游】哪怕 .env 里切成 openai_compat（联机验收时会那么切），测试也一律走规则 ——
      # 否则一条"逐项降级"的纯函数单测会真去调厂商 API（花真钱）。这个坑踩过一次了。
      ENRICH_PROVIDER: rule
      ENRICH_API_KEY: ""           # 顺便把真 key 挡在测试容器外
      # 向量 / 问答侧同样不打真上游：hash 桩向量 + extractive 兜底，也不依赖 fastembed
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: document_chunks_test
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "64"
      LLM_PROVIDER: extractive
      APP_ROLE: all                # 测试要同时打摄入与问答路由
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    # 挂载测试目录：改测试后直接重跑即可，不必每次 `--build`
    # （注意 `docker compose run` 默认【复用已有镜像】，不重建 —— 所以挂载很省事）
    volumes:
      - ./tests:/app/tests
    networks: [backend]

  # ---------- 评测 runner（profile 隔离：只有显式 --profile eval 才会跑）----------
  # 复用 test 镜像（pytest / httpx / pyyaml 都在 requirements-dev.txt），挂载 evals/
  # 让 JSON + Markdown 直接落回仓库。一次性任务：不设 container_name / restart。
  # 用法：docker compose --profile eval run --rm eval python -m scripts.eval_rag --config dense --split test
  eval:
    build:
      context: .
      target: test
    profiles: ["eval"]
    environment:
      EVAL_BASE_URL: http://rag-api:8000
    volumes:
      - ./evals:/app/evals
    depends_on:
      rag-api:
        condition: service_healthy
    networks: [backend]

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456   # 仅本地开发用
      MYSQL_DATABASE: rag_ingest           # 对应 .env 的 DB_NAME
      MYSQL_USER: app                   # 对应 DB_USER
      MYSQL_PASSWORD: app               # 对应 DB_PASSWORD
      # 【为什么要有 LANG】mysql 客户端按 OS locale 选会话字符集；容器里不设 locale 它会退回 latin1，
      # 于是把中文转成 latin1 再发出来 —— 表示不了的字符直接变 `?`（有损，不是显示问题）。
      # 服务端与 app 侧本来就是 utf8mb4（见下面的 command 与 DSN 的 charset），只有命令行客户端会中招。
      # 设了它，`docker compose exec mysql mysql ...` 就不必每次带 --default-character-set=utf8mb4 了。
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 中文全文检索用 ngram 解析器；token size=2 是默认值，显式写出来便于排查
      - --ngram-token-size=2
    ports:
      - "3307:3306"                     # 只给宿主机 GUI 工具；应用走服务名 mysql:3306
    volumes:
      - mysql_data:/var/lib/mysql       # 命名卷：容器删了数据还在
    healthcheck:
      # $$ 是 compose 的转义：传给容器后变成 $，再由容器内 shell 展开成真实口令
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [backend]

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    command: ["redis-server", "--appendonly", "yes"]   # 开 AOF 持久化
    ports:
      - "6380:6379"                     # 只给宿主机 GUI 工具；应用走服务名 redis:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [backend]

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  fastembed_models:

networks:
  backend:
    driver: bridge
